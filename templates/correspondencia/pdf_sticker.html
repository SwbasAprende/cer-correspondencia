<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  @page {
    size: 9cm 6cm;
    margin: 0.3cm;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Courier New', monospace; }

  .sticker {
    border: 2pt solid #1a3a2a;
    border-radius: 5pt;
    padding: 8pt;
    width: 100%;
    height: 100%;
  }
  .st-entidad {
    font-size: 6.5pt; font-weight: bold; text-transform: uppercase;
    color: #1a3a2a; letter-spacing: 1pt;
    border-bottom: 1pt dashed #ccc; padding-bottom: 5pt; margin-bottom: 5pt;
  }
  .st-numero {
    font-size: 16pt; font-weight: 900; color: #1a3a2a;
    letter-spacing: 2pt; margin-bottom: 4pt;
  }
  .st-fila { font-size: 8pt; color: #333; margin-top: 2pt; }
  .st-badges { margin-top: 6pt; }
  .st-badge {
    display: inline-block; font-size: 7pt; font-weight: bold;
    background: #1a3a2a; color: #fff;
    padding: 1pt 6pt; border-radius: 3pt; margin-right: 3pt;
  }
  .st-asunto {
    font-size: 7.5pt; color: #555; margin-top: 6pt;
    border-top: 1pt dashed #ccc; padding-top: 5pt;
    font-family: Arial, sans-serif;
  }
</style>
</head>
<body>
<div class="sticker">
  <div class="st-entidad">Centro de Estudios Regionales — CER</div>
  <div class="st-numero">{{ documento.radicado }}</div>
  <div class="st-fila">📅 Fecha: {{ fecha_rad }}</div>
  <div class="st-fila">🕐 Hora: {{ hora_rad }}</div>
  <div class="st-badges">
    <span class="st-badge">{{ documento.get_tipo_display }}</span>
    <span class="st-badge">{{ documento.get_flujo_display }}</span>
    <span class="st-badge">{{ documento.get_prioridad_display }}</span>
  </div>
  <div class="st-asunto">{{ documento.asunto|truncatechars:80 }}</div>
</div>
</body>
</html>
